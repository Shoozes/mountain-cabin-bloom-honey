# Deploys the static Pages build to https://shoozes.github.io/mountain-cabin-bloom-honey/
# Pages is already configured with "GitHub Actions" as its source.
#
# The build is `vite build --mode pages` (base = /mountain-cabin-bloom-honey/,
# prerendered static HTML in dist/client). It never runs the texture bake: the
# PNG corpus in public/textures is committed and shipped as-is.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-flight deploy finish instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # @tanstack/react-start requires node >= 22.12
          node-version: 22
          cache: npm

      # `npm install` rather than `npm ci`: the committed lockfile is not in
      # sync for npm 10's strict `ci` check (ajv), and this job must not edit it.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build (Pages mode, no texture bake)
        run: npm run build:pages

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
